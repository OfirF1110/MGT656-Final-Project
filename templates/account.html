{% extends 'app.html' %}
{% block title %}Your account · OfferChat{% endblock %}
{% block content %}
  <div class="page-head">
    <div>
      <h1 class="page-title">Your account</h1>
      <p class="page-meta">Signed in as <span class="text-break">{{ user.username }}</span></p>
    </div>
  </div>
  <section class="panel" aria-labelledby="account-access">
    <h2 class="panel-title" id="account-access">Access</h2>
    <p class="mb-3">Logged in as {{ user.username }}.</p>
    {% if user.is_staff %}
      <div class="d-flex gap-2 flex-wrap">
        <a href="/admin/" class="btn btn-quiet">Django administration</a>
      </div>
    {% endif %}
  </section>
{% endblock %}
