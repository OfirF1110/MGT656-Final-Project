<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OfferChat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
  <style>
    .workspace { max-width: 760px; }
    input:not([type="hidden"]) {
      display: block;
      width: 100%;
      padding: 0.65rem;
      border: 1px solid #767676;
      border-radius: 0.375rem;
    }
    .errorlist { color: #b02a37; }
  </style>
</head>
<body class="bg-light">
  <div class="container workspace py-4">
    <nav aria-label="Main navigation"
         class="d-flex flex-wrap align-items-center gap-3 mb-4">
      <a href="{% url 'home' %}" class="fw-bold">OfferChat</a>
      {% if user.is_authenticated %}
        <a href="{% url 'account' %}">My account</a>
        <form method="post" action="{% url 'logout' %}" class="m-0">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-secondary">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Log in</a>
      {% endif %}
    </nav>
    <main class="card shadow-sm">
      <div class="card-body p-3 p-sm-4">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
